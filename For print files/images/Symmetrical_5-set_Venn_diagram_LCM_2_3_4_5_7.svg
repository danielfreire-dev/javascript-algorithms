<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-1790 -1900 3648 3648">
 <title>Symmetrical 5-set Venn diagram LCM 2 3 4 5 7</title>
 <desc>Radially-symmetrical Five-set Venn Diagram devised by Branko Gruenbaum and rendered by CMG Lee to show the lowest common multiples of 2, 3, 4, 5 and 7 (6 is skipped as it is just 2 times 3).</desc>
 <defs>
  <ellipse id="set" cx="120" cy="-275" rx="1000" ry="1587"/>
  <g id="sets">
   <use xlink:href="#set" fill="#6600ff"/>
   <use xlink:href="#set" fill="#0099ff" transform="rotate( 72)"/>
   <use xlink:href="#set" fill="#00cc00" transform="rotate(144)"/>
   <use xlink:href="#set" fill="#cc9900" transform="rotate(216)"/>
   <use xlink:href="#set" fill="#ff0000" transform="rotate(288)"/>
  </g>
 </defs>
 <circle cx="0" cy="0" r="99999" fill="#ffffff"/>
 <g font-family="Helvetica,Arial,sans-serif" text-anchor="middle" stroke="none">
  <use xlink:href="#sets" fill-opacity="0.3"/>
  <use xlink:href="#sets" fill-opacity="0" opacity="0.5" stroke="#000000" stroke-width="6"/>
  <g font-size="240">
   <text transform="translate(    0,    0) scale(0.9,1)" x="0" y="0.7ex">420</text>
   <text transform="translate(  120,-1590) scale(0.9,1)" x="0" y="0.7ex">2</text>
