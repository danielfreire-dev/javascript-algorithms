   <text transform="translate(-1300,  150) scale(0.9,1)" x="0" y="0.7ex">35</text>
   <text transform="translate(  600,  900) scale(0.9,1)" x="0" y="0.7ex">12</text>
   <text transform="translate(  690, -960) scale(0.9,1)" x="0" y="0.7ex">30</text>
